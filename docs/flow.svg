<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="Block diagram: sources are parsed, indexed outside the project, and served to agents as read-only tools">
  <!-- Bloc-diagramme. Mise en forme en attributs de presentation, animation
       en SMIL: pas de CSS interne, certains visualiseurs le retirent. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1120" height="420" fill="#ffffff"/>
  <rect x="8" y="8" width="1104" height="404" fill="none" stroke="#b3b3b3"/>

  <g font-family="Helvetica, Arial, DejaVu Sans, sans-serif" text-anchor="middle">

    <!-- ===================== Chaine principale ===================== -->
    <rect x="55"  y="70" width="170" height="64" fill="#f5f5f5" stroke="#666666"/>
    <text x="140" y="97"  font-size="13" fill="#000000">Sources</text>
    <text x="140" y="117" font-size="11" fill="#333333">.prj  .c  .h</text>

    <rect x="265" y="70" width="170" height="64" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="350" y="97"  font-size="13" fill="#000000">Parse</text>
    <text x="350" y="117" font-size="11" fill="#333333">tree-sitter C</text>

    <rect x="475" y="70" width="170" height="64" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="560" y="97"  font-size="13" fill="#000000">Index</text>
    <text x="560" y="117" font-size="11" fill="#333333">SQLite</text>

    <rect x="685" y="70" width="170" height="64" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="770" y="97"  font-size="13" fill="#000000">Tools</text>
    <text x="770" y="117" font-size="11" fill="#333333">17 read-only</text>

    <rect x="895" y="70" width="170" height="64" fill="#d5e8d4" stroke="#82b366"/>
    <text x="980" y="97"  font-size="13" fill="#000000">Agents</text>
    <text x="980" y="117" font-size="11" fill="#333333">MCP / stdio</text>

    <!-- ===================== Liaisons animees ====================== -->
    <g stroke="#000000" stroke-width="1" fill="none" stroke-dasharray="6 4" marker-end="url(#a)">
      <line x1="225" y1="102" x2="262" y2="102">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="435" y1="102" x2="472" y2="102">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="645" y1="102" x2="682" y2="102">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="855" y1="102" x2="892" y2="102">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <path d="M 560 134 V 180 H 450 V 212">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M 770 134 V 180 H 850 V 212">
        <animate attributeName="stroke-dashoffset" values="10;0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ===================== Second niveau ========================= -->
    <rect x="320" y="214" width="260" height="52" fill="#f5f5f5" stroke="#666666"/>
    <text x="450" y="237" font-size="13" fill="#000000">Index and audit log</text>
    <text x="450" y="255" font-size="11" fill="#333333">~/.cvi-mcp, outside the project</text>

    <rect x="700" y="214" width="300" height="52" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="850" y="237" font-size="13" fill="#000000">Output guard</text>
    <text x="850" y="255" font-size="11" fill="#333333">signatures only, unless ALLOW_BODY=1</text>

    <!-- ===================== Notes ================================= -->
    <g text-anchor="start" font-size="11" fill="#333333">
      <text x="40" y="310">Sources are never modified. The project file decides which files exist.</text>
      <text x="40" y="330">CVI macros are blanked in place, so reported lines and columns stay exact.</text>
      <text x="40" y="350">Every call is logged with the number of code lines returned.</text>
    </g>

    <!-- ===================== Cartouche ============================= -->
    <g stroke="#b3b3b3" fill="none">
      <rect x="837" y="352" width="275" height="60"/>
      <line x1="837" y1="382" x2="1112" y2="382"/>
      <line x1="1042" y1="352" x2="1042" y2="412"/>
    </g>
    <g text-anchor="start" fill="#000000">
      <text x="849" y="372" font-size="13" font-weight="bold">cvi-mcp</text>
      <text x="849" y="402" font-size="11" fill="#333333">Read-only data flow</text>
      <text x="1054" y="372" font-size="11" fill="#333333">0.3.2</text>
      <text x="1054" y="402" font-size="11" fill="#333333">rev A</text>
    </g>
  </g>
</svg>
