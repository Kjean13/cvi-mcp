<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="cvi-mcp, read-only MCP server for LabWindows/CVI projects">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="#0d1117"/>
  <circle cx="440" cy="150" r="260" fill="url(#halo)"/>

  <g font-family="Inter, Segoe UI, Helvetica Neue, DejaVu Sans, Arial, sans-serif">

    <!-- Marque: un graphe d'appel, trois arretes depuis une racine -->
    <g transform="translate(372 94)">
      <rect width="132" height="132" rx="30" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <g stroke="url(#mark)" stroke-width="4.5" stroke-linecap="round" fill="none">
        <path d="M46 66 C 70 66, 74 36, 96 36"/>
        <path d="M46 66 H 96"/>
        <path d="M46 66 C 70 66, 74 96, 96 96"/>
      </g>
      <circle cx="42" cy="66" r="11" fill="url(#mark)"/>
      <circle cx="98" cy="36" r="7.5" fill="#c4b5fd"/>
      <circle cx="98" cy="66" r="7.5" fill="#c4b5fd"/>
      <circle cx="98" cy="96" r="7.5" fill="#c4b5fd"/>
    </g>

    <!-- Nom -->
    <text x="548" y="182" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="3">CVI-MCP</text>

    <!-- Accroche -->
    <text x="640" y="252" font-size="19" fill="#8b949e" text-anchor="middle">Read-only MCP server for LabWindows/CVI projects</text>
  </g>
</svg>
